name: Translation / localization bug
description: Report a problem with how AGu displays a translated language
labels: ["translation / i18n"]
type: "bug"
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: Which interface language are you using?
      placeholder: e.g. Vietnamese
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Bug description
      description: What is displayed wrong, and where in the app?
    validations:
      required: true
  - type: textarea
    id: str
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the language to ...
        2. go to ...
        3. then ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AGu Version
      description: What version of AGu are you running? (Found under Help > About AGu)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: What OS does this bug occur on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: A screenshot of the problem helps a lot
